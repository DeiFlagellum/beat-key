# Uruchomienie serwera klucza u operatora.
#
# Cala robota operatora to: ustawic BEAT_KEY_OP, wystawic port pod HTTPS i
# uruchomic. Klucz wytworzy sie sam przy pierwszym starcie i zostanie w
# nazwanym woluminie. Nikt go stamtad nie wyjmuje — takze autor tego pliku.
#
# Pelny kontrakt: PROTOCOL.md

services:
  beat-key:
    # PO DIGESCIE, nie po tagu (R7). Tag mozna przestawic na inny obraz;
    # digestu nie — to jedyna forma, w ktorej "ten obraz" znaczy naprawde ten
    # obraz. Digest kazdego wydania jest w podsumowaniu przebiegu `release`.
    #
    # beat-key 1.0.0:
    image: ghcr.io/deiflagellum/beat-key@sha256:512b3542aaa3d43f52d0f364d83d681c2b9b2c07d357cd3e55f954f397a30a98
    #
    # Alternatywa dla operatora, ktory woli automatyczne poprawki zamiast
    # przypiecia: `ghcr.io/deiflagellum/beat-key:1` da nowsze wydania 1.x po
    # `docker compose pull`. Wygoda kosztem tego, ze nie wiesz z gory, co
    # uruchamiasz — swiadomy wybor, nie domyslny.
    container_name: beat-key
    restart: unless-stopped

    environment:
      # Stabilny identyfikator PODMIOTU: [a-z0-9-], do 32 znakow, nadawany raz
      # i nigdy nie zmieniany. Bez nazw srodowisk (-prod, -vps2) — zmiana
      # hostingu nie zmienia operatora.
      BEAT_KEY_OP: "zmien-mnie"

    volumes:
      # JEDYNE miejsce, w ktorym istnieje klucz prywatny. Kopia zapasowa tego
      # katalogu to kopia klucza — traktowac jak sejf, nie jak backup aplikacji.
      #
      # Katalog na hoscie, a NIE nazwany wolumen Dockera: nazwany wolumen zyje
      # w /var/lib/docker/volumes, czyli tam, gdzie nikt go nie szuka przy
      # robieniu kopii. Klucz ma lezec pod sciezka, ktora operator zna.
      #
      # `:Z` nadaje katalogowi etykiete SELinuxa (AlmaLinux, Rocky, Fedora).
      # Nazwane wolumeny Docker etykietuje sam, katalogi hosta juz nie — stad
      # ta opcja. Na systemach bez SELinuxa jest ignorowana.
      #
      # Katalog trzeba zalozyc PRZED pierwszym startem, kontener chodzi jako
      # nonroot (uid 65532):
      #     mkdir -p /srv/beat-key && chown 65532:65532 /srv/beat-key
      - /srv/beat-key:/data:Z

    ports:
      # Tylko lokalnie. Na swiat wystawia reverse proxy pod HTTPS — port 8080
      # nie ma po co byc osiagalny z zewnatrz.
      - "127.0.0.1:8080:8080"

    # Serwer nic nie zapisuje poza /data, wiec reszta systemu plikow moze byc
    # tylko do odczytu.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

